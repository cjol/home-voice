# Builds the share APK on every push to main that touches the app, and publishes it as a GitHub release
# (tag v0.1.<commit count>). The tablet picks releases up through Obtainium (see android/SHARING.md).
name: Android release

on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/android-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: android-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Releases must keep the key existing installs were signed with (the share signing config).
      - name: Install signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHARE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "SHARE_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/share.keystore"
          echo "SHARE_KEYSTORE=$RUNNER_TEMP/share.keystore" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: android/app/src/main/assets/wakeword/*.onnx
          key: wakeword-${{ hashFiles('android/scripts/fetch-models.sh') }}

      - name: Fetch wake-word models
        run: test -f android/app/src/main/assets/wakeword/wakeword.onnx || android/scripts/fetch-models.sh

      - name: Build
        run: android/scripts/build-share.sh

      - name: Check signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs dist/*.apk | grep -q "SHA-256 digest: $SIGNING_CERT_SHA256" \
            || { echo "APK is not signed with the expected key; installed copies could not update"; exit 1; }
        env:
          SIGNING_CERT_SHA256: 67f0ec1d861cac28d613eb0f4ff1d8dd192ed92d091ef510aa3ff2395ebabe3e

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.1.$(git rev-list --count HEAD)"
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          notes=$(git log --pretty='- %s' ${prev:+$prev..}HEAD -- android | head -30)
          gh release create "v$version" dist/*.apk --title "Home Voice $version" --notes "${notes:-Rebuild.}"
